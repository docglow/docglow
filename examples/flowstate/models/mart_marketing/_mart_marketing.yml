version: 2

models:
  - name: campaign_performance
    description: >
      Per-campaign paid marketing performance across Google and Facebook: spend, clicks,
      leads, and derived efficiency metrics.
    columns:
      - name: campaign_id
        description: "Natural key for the advertising campaign."
        tests:
          - not_null
          - unique
      - name: channel
        description: "Advertising channel the campaign ran on."
        tests:
          - accepted_values:
              arguments:
                values: ["google", "facebook", "linkedin", "organic"]
              config:
                severity: warn
      - name: campaign_name
        description: "Display name of the campaign."
      - name: impressions
        description: "Ad impressions served."
      - name: clicks
        description: "Clicks on the ad."
      - name: spend_usd
        description: "Advertising spend, in USD."
        tests:
          - not_null
      - name: leads
        description: "Leads attributed to the ad."
      - name: cost_per_click_usd
        description: "Spend divided by clicks, in USD."
        tests:
          - not_null
      - name: cost_per_lead_usd
        description: "Spend divided by leads, in USD."
        tests:
          - not_null
      - name: click_through_rate
        description: "Clicks divided by impressions."

  - name: channel_attribution
    description: >
      Channel-level rollup of marketing spend and acquisition efficiency, feeding the
      Marketing Performance dashboard.
    columns:
      - name: channel
        description: "Marketing channel."
        tests:
          - not_null
      - name: customer_acquisition_cost_usd
        description: "Blended customer acquisition cost for the channel."
        tests:
          - not_null
      - name: impressions
        description: "Ad impressions served."
      - name: clicks
        description: "Clicks on the ad."
      - name: spend_usd
        description: "Advertising spend, in USD."
        tests:
          - not_null
      - name: leads
        description: "Leads attributed to the ad."
      - name: click_through_rate
        description: "Clicks divided by impressions."
      - name: lead_conversion_rate
        description: "Leads divided by clicks."
