version: 2

models:
  - name: stg_salesforce__accounts
    description: "One row per studio-owner business in the sales CRM (prospect or customer)."
    columns:
      - name: account_id
        description: "Primary key. Unique identifier for an account."
        tests:
          - unique
          - not_null
      - name: account_name
        description: "Legal or trading name of the studio-owner business."
      - name: studio_count
        description: "Number of studio locations the account operates."
      - name: account_owner_id
        description: "Sales rep who owns the account relationship."
        tests:
          - not_null
      - name: is_customer
        description: "Whether the account is a closed-won FlowState customer."
        tests:
          - not_null
      - name: industry
        description: "Industry classification of the account."
      - name: billing_city
        description: "City on the billing address."
      - name: billing_state_code
        description: "Two-letter state code on the billing address."
      - name: billing_country
        description: "Country on the billing address."
      - name: annual_revenue_usd
        description: "Self-reported annual revenue of the account, in USD."
      - name: employee_count
        description: "Employees at the account, as reported by the data provider."
      - name: account_type
        description: "Classification of the account in the chart of accounts."
      - name: created_at
        description: "Timestamp when the record was created in the source system."
      - name: updated_at
        description: "Timestamp of the most recent update in the source system."

  - name: stg_salesforce__contacts
    description: "One row per individual person associated with an account."
    columns:
      - name: contact_id
        description: "Primary key. Unique identifier for a contact."
        tests:
          - unique
          - not_null
      - name: account_id
        description: "Account the contact belongs to."
        tests:
          - not_null
      - name: email
        description: "Contact's email address."
      - name: is_primary_contact
        description: "Whether this contact is the primary buyer for the account."
        tests:
          - not_null
      - name: first_name
        description: "Given name."
      - name: last_name
        description: "Family name."
      - name: phone
        description: "Contact phone number."
      - name: title
        description: "Job title."
      - name: contact_role
        description: "Role this contact plays in the buying process."
      - name: lead_source
        description: "Channel the lead originated from."
      - name: created_at
        description: "Timestamp when the record was created in the source system."
      - name: updated_at
        description: "Timestamp of the most recent update in the source system."

  - name: stg_salesforce__leads
    description: "One row per unqualified prospect not yet tied to an account."
    columns:
      - name: lead_id
        description: "Primary key. Unique identifier for a lead."
        tests:
          - unique
          - not_null
      - name: lead_source
        description: "Channel the lead originated from (e.g. webinar, referral, paid)."
      - name: lead_status
        description: "Funnel status: new, working, qualified, or unqualified."
      - name: is_converted
        description: "Whether the lead converted into an account and opportunity."
        tests:
          - not_null
      - name: owner_id
        description: "Sales rep who owns the lead."
        tests:
          - not_null
      - name: first_name
        description: "Given name."
      - name: last_name
        description: "Family name."
      - name: email
        description: "Email address."
      - name: company_name
        description: "Company the lead belongs to."
      - name: industry
        description: "Industry classification of the account."
      - name: estimated_studio_count
        description: "Studio count self-reported by the lead."
      - name: converted_account_id
        description: "Account created when the lead converted."
      - name: converted_opportunity_id
        description: "Opportunity created when the lead converted."
      - name: created_at
        description: "Timestamp when the record was created in the source system."
      - name: converted_at
        description: "Timestamp when the lead converted to an opportunity."

  - name: stg_salesforce__opportunities
    description: "One row per sales deal to sell the FlowState platform to a studio owner."
    columns:
      - name: opportunity_id
        description: "Primary key. Unique identifier for an opportunity."
        tests:
          - unique
          - not_null
      - name: account_id
        description: "Account the opportunity belongs to."
        tests:
          - not_null
      - name: owner_id
        description: "Sales rep who owns the opportunity."
        tests:
          - not_null
      - name: stage_name
        description: "Current pipeline stage (e.g. Discovery, Proposal, Closed Won)."
      - name: amount_arr_usd
        description: "Annual recurring revenue value of the deal in USD."
      - name: is_won
        description: "Whether the opportunity closed won."
        tests:
          - not_null
      - name: is_closed
        description: "Whether the opportunity is in a closed (won or lost) state."
        tests:
          - not_null
      - name: opportunity_name
        description: "Display name of the sales opportunity."
      - name: probability
        description: "Win probability assigned to the sales stage, as a fraction."
      - name: lead_source
        description: "Channel the lead originated from."
      - name: forecast_category
        description: "Forecast category the opportunity rolls up to."
      - name: created_at
        description: "Timestamp when the record was created in the source system."
      - name: close_date
        description: "Expected or actual close date of the opportunity."

  - name: stg_salesforce__opportunity_history
    description: "Stage and amount change log for opportunities over time."
    columns:
      - name: opportunity_history_id
        description: "Primary key. Unique identifier for a history record."
        tests:
          - unique
          - not_null
      - name: opportunity_id
        description: "Opportunity the history record belongs to."
        tests:
          - not_null
      - name: to_stage_name
        description: "Stage the opportunity moved into at this change."
      - name: is_stage_change
        description: "Whether this record represents a pipeline stage transition."
        tests:
          - not_null
      - name: from_stage_name
        description: "Sales stage the opportunity moved out of."
      - name: amount_arr_usd
        description: "Annual recurring revenue attached to the opportunity, in USD."
      - name: probability
        description: "Win probability assigned to the sales stage, as a fraction."
      - name: changed_by_user_id
        description: "User who made the stage change."
        tests:
          - not_null
      - name: created_at
        description: "Timestamp when the record was created in the source system."

  - name: stg_salesforce__users
    description: "One row per FlowState sales rep or manager in the CRM."
    columns:
      - name: user_id
        description: "Primary key. Unique identifier for a CRM user."
        tests:
          - unique
          - not_null
      - name: full_name
        description: "Sales rep or manager's full name."
      - name: role_name
        description: "CRM role (e.g. Account Executive, Sales Manager)."
      - name: quota_arr_usd
        description: "Annual ARR quota assigned to the rep in USD."
      - name: email
        description: "Email address."
      - name: sales_team
        description: "Sales team the owner belongs to."
      - name: manager_id
        description: "Employee ID of this person's manager."
      - name: region
        description: "Sales region the studio belongs to."
      - name: is_active
        description: "True when the record is currently active."
        tests:
          - not_null
      - name: created_at
        description: "Timestamp when the record was created in the source system."
