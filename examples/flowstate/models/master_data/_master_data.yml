version: 2

models:
  - name: dim_class
    description: "Conformed class dimension — one row per class offering."
    columns:
      - name: class_id
        description: "Primary key. Unique identifier for a class."
        tests:
          - unique
          - not_null
      - name: studio_id
        description: "The studio that offers this class."
        tests:
          - relationships:
              arguments:
                to: ref('dim_studio')
                field: studio_id
      - name: class_type
        description: "Modality, e.g. yoga, HIIT, cycling, pilates."
        tests:
          - accepted_values:
              arguments:
                values: ["yoga", "hiit", "cycle", "pilates", "barre"]
              config:
                severity: warn
      - name: studio_name
        description: "Display name of the studio."
      - name: class_name
        description: "Display name of the class offering."
      - name: duration_minutes
        description: "Scheduled length of the class, in minutes."
      - name: capacity
        description: "Maximum number of members the class can hold."
      - name: is_active
        description: "True when the record is currently active."
        tests:
          - not_null

  - name: dim_date
    description: "Date spine dimension — one row per calendar day, with common date parts."
    columns:
      - name: date_day
        description: "Primary key. The calendar day."
        tests:
          - unique
          - not_null
      - name: is_weekend
        description: "True for Saturday and Sunday."
        tests:
          - not_null
      - name: year
        description: "Calendar year."
      - name: month_number
        description: "Month number (1-12)."
      - name: day_of_month
        description: "Day of the month (1-31)."
      - name: day_of_week
        description: "Day-of-week name for the calendar day."
      - name: year_month
        description: "Year and month as YYYY-MM."
      - name: month_name
        description: "Month name for the calendar day."
      - name: first_day_of_month
        description: "First calendar day of the month."
      - name: first_day_of_quarter
        description: "First calendar day of the fiscal quarter."

  - name: dim_instructor
    description: "Conformed instructor dimension — one row per instructor, enriched with their studio."
    columns:
      - name: instructor_id
        description: "Primary key. Unique identifier for an instructor."
        tests:
          - unique
          - not_null
      - name: studio_id
        description: "The studio the instructor teaches at."
        tests:
          - relationships:
              arguments:
                to: ref('dim_studio')
                field: studio_id
      - name: specialty
        description: "Primary class modality the instructor teaches."
      - name: studio_name
        description: "Display name of the studio."
      - name: region
        description: "Sales region the studio belongs to."
      - name: first_name
        description: "Given name."
      - name: last_name
        description: "Family name."
      - name: email
        description: "Email address."
      - name: hired_date
        description: "Date the instructor was hired."
      - name: is_active
        description: "True when the record is currently active."
        tests:
          - not_null

  - name: dim_member
    description: >
      Conformed member dimension — one row per FlowState end client, enriched with their
      studio.
    columns:
      - name: member_id
        description: "Primary key. Unique identifier for a member."
        tests:
          - unique
          - not_null
      - name: studio_id
        description: "The studio the member belongs to."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_studio')
                field: studio_id
      - name: email
        description: "Member's email address."
      - name: member_status
        description: "Lifecycle status: active, paused, or cancelled."
      - name: tenure_days
        description: "Days since the member joined."
      - name: studio_name
        description: "Display name of the studio."
      - name: region
        description: "Sales region the studio belongs to."
      - name: first_name
        description: "Given name."
      - name: last_name
        description: "Family name."
      - name: joined_date
        description: "Date the member joined the studio."

  - name: dim_membership_plan
    description: "Conformed membership-plan dimension — one row per plan tier offered by a studio."
    columns:
      - name: plan_id
        description: "Primary key. Unique identifier for a membership plan."
        tests:
          - unique
          - not_null
      - name: studio_id
        description: "The studio that offers this plan."
        tests:
          - relationships:
              arguments:
                to: ref('dim_studio')
                field: studio_id
      - name: plan_tier
        description: "Tier of the plan: unlimited, class-pack, or drop-in."
        tests:
          - accepted_values:
              arguments:
                values: ["unlimited", "class_pack", "drop_in"]
              config:
                severity: warn
      - name: studio_name
        description: "Display name of the studio."
      - name: plan_name
        description: "Display name of the membership plan."
      - name: billing_interval
        description: "How often the plan bills (monthly or annual)."
        tests:
          - accepted_values:
              arguments:
                values: ["monthly", "annual"]
              config:
                severity: warn
      - name: monthly_price_usd
        description: "Monthly price of the plan, in USD."
      - name: included_class_credits
        description: "Class credits included in the plan each billing period."
      - name: is_active
        description: "True when the record is currently active."
        tests:
          - not_null

  - name: dim_studio
    description: "Conformed studio dimension — one row per studio (a FlowState customer location)."
    columns:
      - name: studio_id
        description: "Primary key. Unique identifier for a studio."
        tests:
          - unique
          - not_null
      - name: studio_name
        description: "Display name of the studio."
      - name: region
        description: "Sales/ops region the studio rolls up to."
      - name: city
        description: "City the studio operates in."
      - name: state_code
        description: "Two-letter state code."
      - name: timezone
        description: "IANA time zone the studio schedules classes in."
      - name: opened_date
        description: "Date the studio opened for business."
      - name: is_active
        description: "True when the record is currently active."
        tests:
          - not_null

  - name: fact_booking
    description: "Booking fact — one row per member reservation for a scheduled class."
    columns:
      - name: booking_id
        description: "Primary key. Unique identifier for a booking."
        tests:
          - unique
          - not_null
      - name: studio_id
        description: "Studio the booking was made at."
        tests:
          - relationships:
              arguments:
                to: ref('dim_studio')
                field: studio_id
      - name: member_id
        description: "Member who made the booking."
        tests:
          - relationships:
              arguments:
                to: ref('dim_member')
                field: member_id
      - name: class_id
        description: "Class that was booked."
        tests:
          - relationships:
              arguments:
                to: ref('dim_class')
                field: class_id
      - name: instructor_id
        description: "Instructor teaching the booked class."
        tests:
          - relationships:
              arguments:
                to: ref('dim_instructor')
                field: instructor_id
      - name: is_attended
        description: "1 if the member checked in, else 0."
        tests:
          - not_null
      - name: is_no_show
        description: "True if the member booked but did not attend."
        tests:
          - not_null
      - name: schedule_id
        description: "Foreign key to the scheduled class instance."
        tests:
          - not_null
      - name: class_start_at
        description: "Scheduled start time of the class."
      - name: booking_status
        description: "Status of the booking (booked, attended, cancelled, no-show)."
        tests:
          - accepted_values:
              arguments:
                values: ["booked", "attended", "cancelled", "no_show"]
              config:
                severity: warn
      - name: booked_at
        description: "Timestamp when the booking was made."
      - name: checked_in_at
        description: "Timestamp when the member checked in. Null if they never arrived."

  - name: fact_checkin
    description: "Check-in fact — one row per attended booking (member physically checked in)."
    columns:
      - name: booking_id
        description: "Primary key. The booking that was checked in."
        tests:
          - unique
          - not_null
      - name: studio_id
        description: "Studio the check-in occurred at."
        tests:
          - relationships:
              arguments:
                to: ref('dim_studio')
                field: studio_id
      - name: member_id
        description: "Member who checked in."
        tests:
          - relationships:
              arguments:
                to: ref('dim_member')
                field: member_id
      - name: class_id
        description: "Class that was attended."
        tests:
          - relationships:
              arguments:
                to: ref('dim_class')
                field: class_id
      - name: instructor_id
        description: "Instructor who taught the attended class."
        tests:
          - relationships:
              arguments:
                to: ref('dim_instructor')
                field: instructor_id
      - name: minutes_from_booking_to_checkin
        description: "Minutes elapsed between booking and check-in."
      - name: schedule_id
        description: "Foreign key to the scheduled class instance."
        tests:
          - not_null
      - name: class_start_at
        description: "Scheduled start time of the class."
      - name: checked_in_at
        description: "Timestamp when the member checked in. Null if they never arrived."
      - name: checkin_date
        description: "Calendar day the member checked in."

  - name: fact_membership
    description: "Membership fact — one row per membership, with active-days and status."
    columns:
      - name: membership_id
        description: "Primary key. Unique identifier for a membership."
        tests:
          - unique
          - not_null
      - name: member_id
        description: "Member who holds the membership."
        tests:
          - relationships:
              arguments:
                to: ref('dim_member')
                field: member_id
      - name: plan_id
        description: "Membership plan the member is on."
        tests:
          - relationships:
              arguments:
                to: ref('dim_membership_plan')
                field: plan_id
      - name: studio_id
        description: "Studio the membership belongs to."
        tests:
          - relationships:
              arguments:
                to: ref('dim_studio')
                field: studio_id
      - name: active_days
        description: "Days the membership has been (or was) active."
      - name: is_active
        description: "1 if the membership is currently active, else 0."
        tests:
          - not_null
      - name: plan_tier
        description: "Plan tier (unlimited, class pack, or drop-in)."
        tests:
          - accepted_values:
              arguments:
                values: ["unlimited", "class_pack", "drop_in"]
              config:
                severity: warn
      - name: status
        description: "Current status of the record in the source system."
      - name: started_at
        description: "Timestamp when the record became active."
      - name: ended_at
        description: "Timestamp when the record ended."
      - name: auto_renew
        description: "True when the membership renews automatically."
      - name: monthly_price_usd
        description: "Monthly price of the plan, in USD."

  - name: fact_payment
    description: "Payment fact — one row per Stripe charge, with recognized net revenue."
    columns:
      - name: charge_id
        description: "Primary key. Unique identifier for a charge."
        tests:
          - unique
          - not_null
      - name: member_id
        description: "Member the charge belongs to."
        tests:
          - relationships:
              arguments:
                to: ref('dim_member')
                field: member_id
      - name: studio_id
        description: "Studio the member belongs to."
        tests:
          - relationships:
              arguments:
                to: ref('dim_studio')
                field: studio_id
      - name: net_revenue_usd
        description: "Recognized revenue: charge amount when succeeded and not refunded, else 0."
      - name: amount_usd
        description: "Transaction amount in USD."
      - name: currency
        description: "ISO 4217 currency code the amount is denominated in."
        tests:
          - accepted_values:
              arguments:
                values: ["USD", "CAD", "GBP", "EUR"]
              config:
                severity: warn
      - name: charge_status
        description: "Outcome of the payment charge."
      - name: charged_at
        description: "Timestamp when the charge was submitted to the gateway."
      - name: refunded
        description: "True when the charge was refunded."
