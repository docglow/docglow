version: 2

models:
  - name: stg_stripe__charges
    description: >
      One row per Stripe charge. This is the legacy payment path, kept alongside
      Chargebee while billing migrates; amounts are in the charge currency.
    columns:
      - name: charge_id
        tests:
          - unique
          - not_null
      - name: customer_email
      - name: amount
      - name: currency
        tests:
          - accepted_values:
              arguments:
                values: ["USD", "CAD", "GBP", "EUR"]
              config:
                severity: warn
      - name: status
      - name: created_at
      - name: refunded
