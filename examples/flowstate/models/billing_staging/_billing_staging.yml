version: 2

models:
  - name: stg_chargebee__credit_notes
    description: >
      Staged Chargebee credit notes, one row per refund or adjustment issued against an
      invoice.
    columns:
      - name: credit_note_id
        description: "Primary key. Unique identifier for the credit note."
        tests:
          - unique
          - not_null
      - name: invoice_id
        description: "Foreign key to the invoice the credit note offsets."
        tests:
          - not_null
      - name: reason_code
        description: "Reason the credit note was issued (refund, write_off, adjustment)."
      - name: total_usd
        description: "Total credited amount in USD."
      - name: subscription_id
        description: "Foreign key to the billing subscription."
        tests:
          - not_null
      - name: member_id
        description: "Foreign key to the member."
        tests:
          - not_null
      - name: status
        description: "Current status of the record in the source system."
      - name: amount_refunded_usd
        description: "Amount refunded, in USD."
      - name: amount_allocated_usd
        description: "Amount of the credit applied to this transaction, in USD."
      - name: currency
        description: "ISO 4217 currency code the amount is denominated in."
        tests:
          - accepted_values:
              arguments:
                values: ["USD", "CAD", "GBP", "EUR"]
              config:
                severity: warn
      - name: issued_at
        description: "Timestamp when the invoice was issued."
      - name: created_at
        description: "Timestamp when the record was created in the source system."

  - name: stg_chargebee__invoice_line_items
    description: "Staged Chargebee invoice line items, one row per charge composing an invoice."
    columns:
      - name: line_item_id
        description: "Primary key. Unique identifier for the invoice line item."
        tests:
          - unique
          - not_null
      - name: invoice_id
        description: "Foreign key to the parent invoice."
        tests:
          - not_null
      - name: line_item_type
        description: "Type of line item (plan, addon, tax, adjustment)."
      - name: amount_usd
        description: "Extended amount for the line item in USD."
      - name: subscription_id
        description: "Foreign key to the billing subscription."
        tests:
          - not_null
      - name: plan_id
        description: "Foreign key to the membership plan."
        tests:
          - not_null
      - name: description
        description: "Free-text description of the line item."
      - name: quantity
        description: "Units billed on the line item."
      - name: unit_amount_usd
        description: "Price per unit on the line item, in USD."
      - name: is_taxed
        description: "True when tax applies to the line item."
        tests:
          - not_null
      - name: created_at
        description: "Timestamp when the record was created in the source system."

  - name: stg_chargebee__invoices
    description: "Staged Chargebee invoices, one row per invoice with billed totals and payment status."
    columns:
      - name: invoice_id
        description: "Primary key. Unique identifier for the invoice."
        tests:
          - unique
          - not_null
      - name: subscription_id
        description: "Foreign key to the subscription the invoice was billed against."
        tests:
          - not_null
      - name: member_id
        description: "Foreign key to the billed member (ties to dim_member)."
        tests:
          - not_null
      - name: total_usd
        description: "Total invoiced amount in USD."
      - name: amount_paid_usd
        description: "Amount actually paid against the invoice in USD."
      - name: status
        description: "Current status of the record in the source system."
      - name: amount_due_usd
        description: "Amount still outstanding on the invoice, in USD."
      - name: currency
        description: "ISO 4217 currency code the amount is denominated in."
        tests:
          - accepted_values:
              arguments:
                values: ["USD", "CAD", "GBP", "EUR"]
              config:
                severity: warn
      - name: issued_at
        description: "Timestamp when the invoice was issued."
      - name: due_at
        description: "Timestamp when payment on the invoice becomes due."
      - name: paid_at
        description: "Timestamp when the invoice was paid in full. Null if unpaid."
      - name: created_at
        description: "Timestamp when the record was created in the source system."

  - name: stg_chargebee__subscription_plans
    description: >
      Staged Chargebee plan catalog with pricing, tier, and billing cadence per
      membership plan.
    columns:
      - name: plan_id
        description: "Primary key. Unique identifier for the plan."
        tests:
          - unique
          - not_null
      - name: plan_name
        description: "Human-readable plan name."
      - name: plan_tier
        description: "Plan tier classification (e.g. basic, plus, unlimited)."
        tests:
          - accepted_values:
              arguments:
                values: ["unlimited", "class_pack", "drop_in"]
              config:
                severity: warn
      - name: price_usd
        description: "List price of the plan per billing period in USD."
      - name: status
        description: "Current status of the record in the source system."
      - name: billing_period
        description: "Length of the billing period, in billing period units."
      - name: billing_period_unit
        description: "Unit the billing period is measured in (month or year)."
        tests:
          - accepted_values:
              arguments:
                values: ["month", "year"]
              config:
                severity: warn
      - name: trial_period_days
        description: "Length of the free trial, in days."
      - name: is_metered
        description: "True when the plan bills on usage rather than a flat fee."
        tests:
          - not_null
      - name: created_at
        description: "Timestamp when the record was created in the source system."
      - name: updated_at
        description: "Timestamp of the most recent update in the source system."

  - name: stg_chargebee__subscriptions
    description: >
      Staged Chargebee subscriptions, one row per membership subscription with status,
      lifecycle timestamps, and monthly recurring revenue.
    columns:
      - name: subscription_id
        description: "Primary key. Unique identifier for the subscription."
        tests:
          - unique
          - not_null
      - name: member_id
        description: "Foreign key to the member who owns the subscription (ties to dim_member)."
        tests:
          - not_null
      - name: plan_id
        description: "Foreign key to the subscription plan."
        tests:
          - not_null
      - name: status
        description: "Current subscription status (active, in_trial, cancelled, paused, non_renewing)."
      - name: mrr_usd
        description: "Normalized monthly recurring revenue for the subscription in USD."
      - name: started_at
        description: "Timestamp when the record became active."
      - name: activated_at
        description: "Timestamp when the subscription first became billable."
      - name: cancelled_at
        description: "Timestamp when the record was cancelled. Null if still active."
      - name: billing_period
        description: "Length of the billing period, in billing period units."
      - name: billing_period_unit
        description: "Unit the billing period is measured in (month or year)."
        tests:
          - accepted_values:
              arguments:
                values: ["month", "year"]
              config:
                severity: warn
      - name: auto_collection
        description: "Whether the subscription is charged automatically or invoiced."
      - name: created_at
        description: "Timestamp when the record was created in the source system."

  - name: stg_chargebee__transactions
    description: "Staged Chargebee transactions, one row per payment or refund attempt at the gateway."
    columns:
      - name: transaction_id
        description: "Primary key. Unique identifier for the transaction."
        tests:
          - unique
          - not_null
      - name: invoice_id
        description: "Foreign key to the invoice the transaction applies to."
        tests:
          - not_null
      - name: transaction_type
        description: "Transaction direction (payment, refund)."
        tests:
          - accepted_values:
              arguments:
                values: ["payment", "refund", "credit"]
              config:
                severity: warn
      - name: status
        description: "Outcome of the transaction (success, failure, voided)."
      - name: amount_usd
        description: "Transaction amount in USD."
      - name: subscription_id
        description: "Foreign key to the billing subscription."
        tests:
          - not_null
      - name: member_id
        description: "Foreign key to the member."
        tests:
          - not_null
      - name: currency
        description: "ISO 4217 currency code the amount is denominated in."
        tests:
          - accepted_values:
              arguments:
                values: ["USD", "CAD", "GBP", "EUR"]
              config:
                severity: warn
      - name: payment_method
        description: "Payment instrument used for the transaction."
      - name: gateway
        description: "Payment gateway that processed the transaction."
      - name: processed_at
        description: "Timestamp when the transaction was processed by the gateway."
      - name: created_at
        description: "Timestamp when the record was created in the source system."
