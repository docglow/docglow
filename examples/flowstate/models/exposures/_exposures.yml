version: 2

exposures:
  - name: studio_performance_dashboard
    label: "Studio Performance Dashboard"
    type: dashboard
    maturity: high
    url: https://bi.flowstate.io/dashboards/studio-performance
    description: >
      Executive dashboard tracking per-studio class utilization, attendance,
      and daily revenue. Used by the FlowState revenue and customer-success teams.
    depends_on:
      - ref('studio_class_utilization')
      - ref('daily_revenue')
    owner:
      name: Revenue Analytics
      email: analytics@flowstate.io

  - name: revenue_and_growth_dashboard
    label: "Revenue & Growth Dashboard"
    type: dashboard
    maturity: high
    url: https://bi.flowstate.io/dashboards/revenue-growth
    description: >
      MRR/ARR, daily revenue, and subscription movement (new/expansion/churn)
      across studios. The finance and leadership weekly business review.
    depends_on:
      - ref('membership_mrr_by_studio')
      - ref('membership_change_events')
      - ref('daily_revenue')
    owner:
      name: Finance
      email: finance@flowstate.io

  - name: marketing_performance_dashboard
    label: "Marketing Performance Dashboard"
    type: dashboard
    maturity: medium
    url: https://bi.flowstate.io/dashboards/marketing
    description: "Paid channel spend, CAC, and campaign performance across Google and Facebook."
    depends_on:
      - ref('campaign_performance')
      - ref('channel_attribution')
    owner:
      name: Growth Marketing
      email: growth@flowstate.io

  - name: sales_pipeline_dashboard
    label: "B2B Sales Pipeline Dashboard"
    type: dashboard
    maturity: high
    url: https://bi.flowstate.io/dashboards/sales-pipeline
    description: "Open/won/lost ARR by stage and rep for the studio-acquisition sales team."
    depends_on:
      - ref('sales_pipeline')
      - ref('opportunity_funnel')
    owner:
      name: Revenue Operations
      email: revops@flowstate.io

  - name: product_engagement_dashboard
    label: "Product Engagement Dashboard"
    type: dashboard
    maturity: medium
    url: https://bi.flowstate.io/dashboards/product-engagement
    description: "DAU/WAU/MAU, session activity, and feature adoption across the member app."
    depends_on:
      - ref('member_engagement')
      - ref('feature_usage')
    owner:
      name: Product Analytics
      email: product@flowstate.io

  - name: member_360_explore
    label: "Member 360 Explore"
    type: analysis
    maturity: high
    url: https://bi.flowstate.io/explores/member-360
    description: >
      Self-serve explore over the conformed member dimension and the check-in and
      membership fact tables. Analysts build ad-hoc cohort and retention cuts here
      rather than querying the marts directly.
    depends_on:
      - ref('dim_member')
      - ref('dim_studio')
      - ref('dim_instructor')
      - ref('dim_membership_plan')
      - ref('fact_checkin')
      - ref('fact_membership')
    owner:
      name: Analytics Engineering
      email: analytics@flowstate.io

  - name: finance_close_workbook
    label: "Monthly Close Workbook"
    type: analysis
    maturity: medium
    url: https://drive.flowstate.io/finance/monthly-close
    description: >
      Spreadsheet the finance team refreshes during monthly close: P&L by account,
      invoice aging, and collections status.
    depends_on:
      - ref('int_ops_monthly_pnl')
      - ref('int_billing_invoices')
      - ref('int_billing_collections')
    owner:
      name: Finance
      email: finance@flowstate.io

  - name: support_operations_dashboard
    label: "Support Operations Dashboard"
    type: dashboard
    maturity: medium
    url: https://bi.flowstate.io/dashboards/support-ops
    description: >
      Ticket volume, resolution time, and CSAT by agent, alongside headcount so the
      support lead can staff against demand.
    depends_on:
      - ref('int_ops_support_tickets')
      - ref('int_ops_headcount_by_department')
    owner:
      name: Customer Support
      email: support@flowstate.io

  - name: lifecycle_marketing_report
    label: "Lifecycle Marketing Report"
    type: dashboard
    maturity: low
    url: https://bi.flowstate.io/dashboards/lifecycle-marketing
    description: >
      Email engagement and lead funnel progression. Marked low maturity — the team
      is still settling on attribution definitions.
    depends_on:
      - ref('int_marketing_email_engagement')
      - ref('int_sales_lead_funnel')
      - ref('int_sales_stage_transitions')
    owner:
      name: Growth Marketing
      email: growth@flowstate.io
